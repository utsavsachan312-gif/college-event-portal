<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">College Portal - Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Notice Board</a>
                <a class="nav-link" href="events.html">Events</a>
                <a class="nav-link active" href="admin.html">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Login Section -->
        <div id="loginSection" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 class="text-center mb-4">Admin Login</h4>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="adminPassword" placeholder="Enter admin password">
                        </div>
                        <button class="btn btn-primary w-100" onclick="adminLogin()">Login</button>
                        <p class="text-muted text-center mt-3 small">Default Password: <b>admin123</b></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard (Login ke baad dikhega) -->
        <div id="adminDashboard" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Admin Dashboard</h2>
                <button class="btn btn-danger" onclick="adminLogout()">Logout</button>
            </div>

            <!-- Add Notice -->
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Add New Notice</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Notice Title</label>
                        <input type="text" class="form-control" id="noticeTitle">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="noticeDesc" rows="3"></textarea>
                    </div>
                    <button class="btn btn-success" onclick="addNotice()">Add Notice</button>
                </div>
            </div>

            <!-- Add Event -->
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Add New Event</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Event Title</label>
                            <input type="text" class="form-control" id="eventTitle">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="eventDate">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Venue</label>
                            <input type="text" class="form-control" id="eventVenue">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Max Seats</label>
                            <input type="number" class="form-control" id="eventSeats">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="eventDesc" rows="2"></textarea>
                        </div>
                    </div>
                    <button class="btn btn-success" onclick="addEvent()">Add Event</button>
                </div>
            </div>

            <!-- Registered Students -->
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">All Registrations</h5>
                </div>
                <div class="card-body">
                    <div id="allRegistrations"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        checkAdminLogin();
    </script>
</body>
</html>
